- name: Stop and disable Hermes services
  systemd_service:
    name: "{{ item }}.service"
    scope: user
    enabled: false
    state: stopped
  loop:
    - hermes-gateway
    - hermes-dashboard
  # systemctl --user must run as the unit's owner. Inventory sets ansible_become(_user) as
  # variables, which outrank the become keywords, so override the variables here.
  vars:
    ansible_become: "{{ hermes_user != ansible_user }}"
    ansible_become_user: "{{ hermes_user }}"
  environment: "{{ hermes_user_env }}"
  tags: [molecule-notest]

- name: Read Tailscale Serve status
  command: tailscale serve status --json
  register: hermes_serve_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: hermes_dashboard_tailscale_serve
  tags: [molecule-notest]

- name: Unpublish Hermes dashboard from Tailscale Serve
  command: tailscale serve --https={{ hermes_dashboard_tailscale_https_port }} off
  when:
    - hermes_dashboard_tailscale_serve
    - hermes_serve_status.stdout | default('') is search('http://127.0.0.1:' ~ hermes_dashboard_port)
  tags: [molecule-notest]
